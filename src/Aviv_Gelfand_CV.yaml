  # SUMMARY
    summary:
      - bullet: 'Early-career Data Scientist with practical, result-oriented experience in DS roles across tech (production-grade), academia, military, and training. MSc in progress (Data Science, HUJI); BSc Statistics & Data Science (HUJI, GPA: 89).'
      - bullet: 'Proven ability to design and implement impactful ML solutions — from classic models to LLMs — in complex, real-world settings, combining high-level software engineering practices with collaborative workflows and rapid self-learning.'
      - bullet: 'Dedicated to long-term growth in a full-time role in a DS / ML Engineering team with a positive atmosphere where I can grow, contribute meaningfully, and help turn innovative ideas into reality.'
    
    # EXPERIENCE
    experience:
      - company: "Darrow AI - Data Science Team"
        position: Data Scientist
        start_date: 2024
        end_date: 
        highlights:
          - Designed and deployed a robust production pipeline that uncovered \$1M+ lead. Leveraged few-shot Chain-of-Thought LLM prompting, optimised costs with OpenAI’s Batch API, enriched and filtered lead databases with domain-specific intelligence, integrating multi-source web scraping.
          - Performed numerous feature developments, model evaluations, and error analysis tasks, collaborated with senior DSs, DEs, PMs, and further stakeholders. 
          - Worked with AWS environment, Airflow, Atlassian (JIRA), Elastic, OpenSearch, and relational tabular databases.
      - company: "Hebrew University of Jerusalem - Dr. Adi Leibovitch's Quantitative Legal Research lab"
        position: NLP Data Scientist / Research Assistant
        start_date: 2023
        end_date: 2024
        highlights:
          - Executed Supervised-Fine-Tuning of open-source LLMs to classify textual argument-types in trials; reduced labeling time and errors, replacing manual tagging with LLM-based tagging.
          - Achieved over 90% accuracy and 80% F1 scores in most target labels. Saved days of model complexity and training time using efficient sampling, overcoming significant imbalance. Presented findings and achievements at a prominent statistics and data science conference in May 2024.
      - company: Upscale Analytics
        position: Statistics & Machine Learning Instructor
        start_date: 2022
        end_date: 2024
        highlights:
          - Built dozens of ML hands-on projects for a Machine Learning and Statistical Inference course, with constant feedback from a Senior Data Scientist (and head lecturer), Michael Winer. Instructed data analysts in tech through their first steps in statistical inference and classic machine learning using Scikit-Learn, SciPy, and XGBoost Libraries. 
          - Advanced from teaching assistant to instructor, then to a partner role. 3 successful semesters of weekly TA sessions with a significant presence of students.
      - company: "Hebrew University of Jerusalem, Renana Peres's Computational Social Science Lab"
        position: Programmer and Research Assistant
        start_date: 2022
        end_date: 2023
        highlights:
          - Self-taught and programmed smart contracts with a C++-based programming language; and developed a simulation interface (React.js). Designed and analyzed experiments, web-scraped data monthly, and did literature and academic peer reviews. 
      - company: Israel Defense Forces (Volunteered, Lieutenant) 
        position: Data Analyst & Research Team Leader
        start_date: 2015
        end_date: 2020
        highlights:
          - "Conducted research, assessments, and analytics for high-ranked decision-makers and tripled teams' ongoing products."
          - Led cross-organizational initiatives, achieving in-depth research papers with an unprecedented collabs between research branches.
    
