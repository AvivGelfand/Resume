    summary:
      - bullet: 'A junior Data Scientist experienced with industry and academic junior positions. 1st year MSc candidate in Data Science (HUJI); BSc in Statistics and Data Science (HUJI; GPA 89).'
      - bullet: 'Dedicated to long-term growth in a cutting-edge company with a positive atmosphere; Looking for a full-time role at a Data Science / ML Engineering teams.'
      - bullet: 'Demonstrated success in AI and software development through numerous roles and projects over the past 8 years, with a track record of implementing classic / one-shot / few-shot models to solve complex problems requiring strong collaboration and rapid self-learning skills, consistently delivering efficient and precise models.'
    experience:
      - company: "Darrow AI"
        position: Data Scientist Intern
        start_date: 2024
        end_date: 2025
        highlights:
          - Developed into production a pipeline of enriching leads databases with domain-focused knowledge, utilizing web-scraping from and data matching from several sources, and Open AI Batch API calls, leading to finding 1M$-value leads out of thousands.
          - Preformed numeros model evaluation and error analysis tasks, side-kicking senior ML Data Scientists, working with AWS environment, elastic and tabular databases, and numeros APIs.
      - company: "Hebrew University of Jerusalem - Dr. Adi Leibovitch's Quantitative Legal Research lab"
        position: NLP Data Scientist / Research Assistant
        start_date: 2023
        end_date: 2025
        highlights:
          - Successfully executed Supervised-Fine-Tuning of large language models (frameworks$:$ PyTorch, Transformers) to classify arguments in trials for a broader statistical legal research project; reduced labeling time and errors, replacing manual tagging with LLM-based tagging.
          - Reached over 90% accuracy and 80% F1 scores in most target labels. Substantially reduced model complexity and training time using efficient sampling and overcoming significant imbalance. Corrected errors in the labeled data.
          - Presented findings and achievements at a prominent statistics and data science conference in May 2024.
      - company: Upscale Analytics
        position: Statistics & Machine Learning Instructor
        start_date: 2022-10
        end_date: 2023-09
        highlights:
          - Built dozens of ML hands-on projects for a Machine Learning and Statistical Inference course, with constant feedback from a Senior Data Scientist (and head lecturer), Michael Winer. Instructed data analysts in tech through their first steps in statistical inference and classic machine learning using Scikit-Learn, SciPy, and XGBoost Libraries. 
          - Advanced from teaching assistant to instructor, then to a partner role. 3 successful semesters of weekly TA sessions with a significant presence of students.
      - company: "Hebrew University of Jerusalem, Renana Peres's Computational Social Science Lab"
        position: Research & Development Assistant
        start_date: 2022-04
        end_date: 2023-03
        highlights:
          - Self-taught and programmed smart-contracts with a C++-based programming language; developed simulations interface (React.js). Designed and analyzed experiments. Web-scraped data monthly. Did literature and academic peer reviews. 
      - company: Israel Defense Forces (Volunteered, Lieutenant) 
        position: Data Analyst & Research Team Leader
        start_date: 2015-03
        end_date: 2020-12
        highlights:
          - "Conducted research, assessments, and analytics for high-ranked decision-makers and led the team's triplication of strategic products."
          - Led cross-organizational projects, achieving several in-depth research papers with an unprecedented collaboration between research branches.
